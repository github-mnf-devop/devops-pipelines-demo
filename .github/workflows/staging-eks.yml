name: EKS Staging Build & Deploy

on:
  workflow_call:
    inputs:
      FILE_PATH:
        description: "squad/service.yaml — e.g. rosca/circle.yaml"
        required: true
        type: string
      SERVICE_NAME:
        required: true
        type: string
      SECRET_FILE_PATH:
        required: false
        type: string
      SECRET_CONTENT_IS_BASE64:
        required: false
        type: string
      BUILD_COMMAND:
        required: false
        type: string
      CUSTOM_DOCKER_PATH:
        required: false
        type: string
      IMAGE_TAG:
        required: false
        type: string

    secrets:
      PAT_TOKEN:
        required: false
      SECRET_FILE_CONTENT:
        required: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.build-image.outputs.image-tag }}

    steps:
      - name: Check out microservice code
        uses: actions/checkout@v4

      - name: Map secret to file
        if: inputs.SECRET_FILE_PATH && inputs.SECRET_FILE_PATH != ''
        env:
          SECRET_FILE_CONTENT: ${{ secrets.SECRET_FILE_CONTENT }}
          IS_BASE64: ${{ inputs.SECRET_CONTENT_IS_BASE64 || 'false' }}
        run: |
          absolute_path="${GITHUB_WORKSPACE}/${{ inputs.SECRET_FILE_PATH }}"
          if [ -z "$SECRET_FILE_CONTENT" ]; then echo "SECRET_FILE_CONTENT is empty." && exit 1; fi
          if [ "$IS_BASE64" = "true" ]; then
            echo "$SECRET_FILE_CONTENT" | base64 --decode > "$absolute_path"
          else
            echo "$SECRET_FILE_CONTENT" > "$absolute_path"
          fi

      - name: Build docker image
        id: build-image
        env:
          SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
          BUILD_COMMAND: ${{ inputs.BUILD_COMMAND }}
          CUSTOM_DOCKER_PATH: ${{ inputs.CUSTOM_DOCKER_PATH }}
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          SQUAD_NAME=$(echo "${{ inputs.FILE_PATH }}" | cut -d'/' -f1)
          REPOSITORY="stg/${SQUAD_NAME}/${SERVICE_NAME}"
          BUILD_TAG="${{ inputs.IMAGE_TAG }}"
          [ -z "$BUILD_TAG" ] && BUILD_TAG="${DATE}-${{ github.run_number }}"
          LOCAL_IMAGE="${SERVICE_NAME}:${BUILD_TAG}"

          if [ -n "$BUILD_COMMAND" ]; then
            eval "$BUILD_COMMAND --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -t $LOCAL_IMAGE -t ${SERVICE_NAME}:${SHORT_SHA} -t ${SERVICE_NAME}:latest"
          elif [ -n "$CUSTOM_DOCKER_PATH" ]; then
            eval "$CUSTOM_DOCKER_PATH --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -t $LOCAL_IMAGE -t ${SERVICE_NAME}:${SHORT_SHA} -t ${SERVICE_NAME}:latest"
          else
            docker build --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
              -t $LOCAL_IMAGE -t ${SERVICE_NAME}:${SHORT_SHA} -t ${SERVICE_NAME}:latest .
          fi

          echo "image-tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT
          echo "local-image=$LOCAL_IMAGE" >> $GITHUB_OUTPUT
          echo "sha-tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: AWS authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::367896522183:role/githubactions-ecr
          role-session-name: Build-ECR-Image-Staging-Demo
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Push to ECR
        env:
          SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
        run: |
          REPOSITORY="${{ steps.build-image.outputs.repository }}"
          LOCAL_IMAGE="${{ steps.build-image.outputs.local-image }}"
          SHA_TAG="${{ steps.build-image.outputs.sha-tag }}"
          BUILD_TAG="${{ steps.build-image.outputs.image-tag }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          if ! aws ecr describe-repositories --repository-names "$REPOSITORY" --region eu-central-1 2>/dev/null; then
            aws ecr create-repository --repository-name "$REPOSITORY" \
              --image-scanning-configuration scanOnPush=true --region eu-central-1
          fi

          docker tag $LOCAL_IMAGE               $REGISTRY/$REPOSITORY:$BUILD_TAG
          docker tag ${SERVICE_NAME}:${SHA_TAG} $REGISTRY/$REPOSITORY:$SHA_TAG
          docker tag ${SERVICE_NAME}:latest      $REGISTRY/$REPOSITORY:latest

          docker push $REGISTRY/$REPOSITORY:$BUILD_TAG
          docker push $REGISTRY/$REPOSITORY:$SHA_TAG
          docker push $REGISTRY/$REPOSITORY:latest

  deploy:
    needs: build
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging environment repository
        uses: actions/checkout@v4
        with:
          repository: github-mnf-devop/devops-staging-environment-demo
          path: "./staging-env"
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Update imageTag in values file
        run: |
          # FILE_PATH: rosca/circle.yaml  →  full path under eks/workload_eks/
          VALUES_FILE="staging-env/eks/workload_eks/${{ inputs.FILE_PATH }}"
          NEW_IMAGE_TAG="${{ needs.build.outputs.image-tag }}"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Values file not found: $VALUES_FILE" && exit 1
          fi

          if grep -q "imageTag:" "$VALUES_FILE"; then
            sed -i "s|imageTag:.*|imageTag: ${NEW_IMAGE_TAG}|g" "$VALUES_FILE"
          else
            echo "imageTag: ${NEW_IMAGE_TAG}" >> "$VALUES_FILE"
          fi

      - name: Commit and push
        env:
          SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
          NEW_IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          cd staging-env
          if git diff --quiet; then echo "No changes" && exit 0; fi
          git add .
          git commit -m "chore: update ${SERVICE_NAME} imageTag to ${NEW_IMAGE_TAG} [skip ci]"
          git push origin main
