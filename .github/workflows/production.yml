name: EKS Prod Deploy (Promote from Staging)

on:
  workflow_call:
    inputs:
      SERVICE_NAME:
        required: true
        type: string
      FILE_PATH:
        description: "squad/service.yaml — e.g. rosca/circle.yaml"
        required: true
        type: string
      DEPLOYMENT_FILES:
        description: "Optional comma-separated list of FILE_PATH values to update multiple files."
        required: false
        type: string
      SECRET_FILE_PATH:
        required: false
        type: string
      SECRET_CONTENT_IS_BASE64:
        required: false
        type: string
    secrets:
      PAT_TOKEN:
        required: false
      SECRET_FILE_CONTENT:
        required: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  check-authorization:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Verify triggering user is in managers team
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/github-mnf-devop/teams/managers/memberships/${{ github.actor }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "User '${{ github.actor }}' is not authorized."
            exit 1
          fi

  promote-image:
    needs: check-authorization
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.promote.outputs.image-tag }}
    steps:
      - name: Map secret to file
        if: inputs.SECRET_FILE_PATH && inputs.SECRET_FILE_PATH != ''
        env:
          SECRET_FILE_CONTENT: ${{ secrets.SECRET_FILE_CONTENT }}
          IS_BASE64: ${{ inputs.SECRET_CONTENT_IS_BASE64 || 'false' }}
        run: |
          absolute_path="${GITHUB_WORKSPACE}/${{ inputs.SECRET_FILE_PATH }}"
          if [ -z "$SECRET_FILE_CONTENT" ]; then echo "SECRET_FILE_CONTENT is empty." && exit 1; fi
          if [ "$IS_BASE64" = "true" ]; then
            echo "$SECRET_FILE_CONTENT" | base64 --decode > "$absolute_path"
          else
            echo "$SECRET_FILE_CONTENT" > "$absolute_path"
          fi

      - name: AWS authentication (Staging ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::367896522183:role/githubactions-ecr
          role-session-name: Pull-Staging-Image-For-Prod
          aws-region: eu-central-1

      - name: Login to Staging Amazon ECR
        id: login-ecr-staging
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Resolve staging image tag via ECR API
        run: |
          SQUAD_NAME=$(echo "${{ inputs.FILE_PATH }}" | cut -d'/' -f1)
          STAGING_REPO="stg/${SQUAD_NAME}/${{ inputs.SERVICE_NAME }}"
          STAGING_REGISTRY="${{ steps.login-ecr-staging.outputs.registry }}"

          # Get the digest of the :latest tag in ECR
          DIGEST=$(aws ecr describe-images \
            --repository-name "$STAGING_REPO" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region eu-central-1)

          # Find the date-based tag (YYYYMMDD-N) that shares that digest
          STAGING_TAG=$(aws ecr describe-images \
            --repository-name "$STAGING_REPO" \
            --image-ids imageDigest="$DIGEST" \
            --query 'imageDetails[0].imageTags' \
            --output text \
            --region eu-central-1 \
            | tr '\t' '\n' \
            | grep -oP '\d{8}-\d+' \
            | head -1)

          if [ -z "$STAGING_TAG" ]; then
            echo "Could not resolve staging tag from ECR, falling back to date-run_number"
            STAGING_TAG="$(date +%Y%m%d)-${{ github.run_number }}"
          fi

          echo "Resolved staging tag: $STAGING_TAG"
          STAGING_IMAGE="${STAGING_REGISTRY}/${STAGING_REPO}:${STAGING_TAG}"

          docker pull "${STAGING_REGISTRY}/${STAGING_REPO}:latest"

          echo "STAGING_IMAGE=${STAGING_REGISTRY}/${STAGING_REPO}:latest" >> $GITHUB_ENV
          echo "SQUAD_NAME=$SQUAD_NAME" >> $GITHUB_ENV
          echo "STAGING_TAG=$STAGING_TAG" >> $GITHUB_ENV

      - name: AWS authentication (Prod ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::084375550983:role/github-actions-ecr
          role-session-name: Push-ECR-Image-Prod-Demo
          aws-region: eu-central-1

      - name: Login to Prod Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Tag and push to Prod ECR
        id: promote
        run: |
          PROD_REPO="prod/${SQUAD_NAME}/${{ inputs.SERVICE_NAME }}"
          PROD_REGISTRY="${{ steps.login-ecr-prod.outputs.registry }}"

          if ! aws ecr describe-repositories --repository-names "$PROD_REPO" --region eu-central-1 2>/dev/null; then
            aws ecr create-repository --repository-name "$PROD_REPO" \
              --image-scanning-configuration scanOnPush=true --region eu-central-1
          fi

          docker tag $STAGING_IMAGE $PROD_REGISTRY/$PROD_REPO:$STAGING_TAG
          docker tag $STAGING_IMAGE $PROD_REGISTRY/$PROD_REPO:latest

          docker push $PROD_REGISTRY/$PROD_REPO:$STAGING_TAG
          docker push $PROD_REGISTRY/$PROD_REPO:latest

          echo "image-tag=$STAGING_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: promote-image
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod environment repository
        uses: actions/checkout@v4
        with:
          repository: github-mnf-devop/devops-iaac-prod-environment-demo
          path: "./prod-env"
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Update imageTag in values file(s)
        run: |
          NEW_IMAGE_TAG="${{ needs.promote-image.outputs.image-tag }}"

          if [ -n "${{ inputs.DEPLOYMENT_FILES }}" ]; then
            TARGET_FILES=$(echo "${{ inputs.DEPLOYMENT_FILES }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          else
            TARGET_FILES="${{ inputs.FILE_PATH }}"
          fi

          while IFS= read -r REL_PATH; do
            [ -z "$REL_PATH" ] && continue
            # FILE_PATH: rosca/circle.yaml  →  full path under k8s/workload/
            VALUES_FILE="prod-env/k8s/workload/${REL_PATH}"

            if [ ! -f "$VALUES_FILE" ]; then
              echo "Values file not found: $VALUES_FILE" && exit 1
            fi

            if grep -q "imageTag:" "$VALUES_FILE"; then
              sed -i "s|imageTag:.*|imageTag: ${NEW_IMAGE_TAG}|g" "$VALUES_FILE"
            else
              echo "imageTag: ${NEW_IMAGE_TAG}" >> "$VALUES_FILE"
            fi
            echo "Updated $VALUES_FILE → imageTag: $NEW_IMAGE_TAG"
          done <<< "$TARGET_FILES"

      - name: Commit and push
        run: |
          cd prod-env
          if git diff --quiet; then echo "No changes" && exit 0; fi
          NEW_IMAGE_TAG="${{ needs.promote-image.outputs.image-tag }}"
          git add .
          git commit -m "chore: update ${{ inputs.SERVICE_NAME }} imageTag to ${NEW_IMAGE_TAG} [skip ci]"
          git push origin main
