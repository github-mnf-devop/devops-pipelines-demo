name: Dotnet Checks

on:
  workflow_call:

jobs:
  gitleaks:
    name: Secrets Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
          | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks on PR changes
        run: |
          BASE_SHA=$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --log-opts "$BASE_SHA..$HEAD_SHA" \
            --exit-code 1

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      quality_gate_status: ${{ steps.qg.outputs.quality-gate-status }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # -----------------------------------------------------------------------
          # DEMO NOTE: Replace 'YOUR_DEMO_ORG' with your demo GitHub org name.
          # In prod this pulls from nuget.pkg.github.com/moneYOUnion.
          # -----------------------------------------------------------------------
          source-url: https://nuget.pkg.github.com/YOUR_DEMO_ORG/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Build and Analyze with SonarQube
        run: |
          repoName=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$repoName" \
            /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
            /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
            /d:sonar.pullrequest.base="${{ github.base_ref }}" \
            /d:sonar.pullrequest.provider="GitHub" \
            /d:sonar.pullrequest.github.repository="${{ github.repository }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          dotnet build
          ./.sonar/scanner/dotnet-sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Check SonarQube Quality Gate
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        continue-on-error: true
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Fail if Quality Gate Failed
        if: steps.qg.outputs.quality-gate-status == 'FAILED'
        run: exit 1

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      lint_result: ${{ steps.lint.outcome }}
      test_result: ${{ steps.test.outcome }}

    steps:
      - name: Check out microservice code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          source-url: https://nuget.pkg.github.com/YOUR_DEMO_ORG/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Validate .NET code
        run: dotnet build --no-restore

      - name: Run .NET Linter
        id: lint
        run: dotnet format --verify-no-changes
        continue-on-error: true

      - name: Run .NET tests
        id: test
        run: dotnet test --no-restore --verbosity normal
        continue-on-error: true

  # -----------------------------------------------------------------------
  # DEMO NOTE: The pr-agent job below uses AWS Bedrock to run AI code review.
  # Replace DEMO_AWS_ACCOUNT_ID with your demo AWS account ID.
  # If you don't have the mf-code-reviewer ECR image in your demo account,
  # you can comment out this job and remove it from the 'summary' needs list.
  # -----------------------------------------------------------------------
  pr-agent:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: arn:aws:iam::DEMO_AWS_ACCOUNT_ID:role/github-bedrock-oidc
          role-session-name: bedrock-session
          aws-region: eu-central-1
          output-credentials: true

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin DEMO_AWS_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com

      - name: Run PR-Agent
        run: |
          mkdir -p /tmp/github_workflow

          PR_DATA=$(curl -s -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }})

          echo "{\"action\": \"opened\", \"pull_request\": $PR_DATA}" \
            > /tmp/github_workflow/event.json

          docker run \
            -e GITHUB_TOKEN=${{ github.token }} \
            -e AWS_REGION=eu-central-1 \
            -e GITHUB_ACTION_CONFIG.AUTO_REVIEW=true \
            -e GITHUB_ACTION_CONFIG.AUTO_DESCRIBE=true \
            -e GITHUB_ACTION_CONFIG.AUTO_IMPROVE=true \
            -e CONFIG__MODEL=bedrock/eu.anthropic.claude-sonnet-4-20250514-v1:0 \
            -e GITHUB_EVENT_NAME=${{ github.event_name }} \
            -e GITHUB_EVENT_PATH=/tmp/github_workflow/event.json \
            -e GITHUB_SHA=${{ github.sha }} \
            -e GITHUB_REF=${{ github.ref }} \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e AWS_ACCESS_KEY_ID=${{ steps.creds.outputs.aws-access-key-id }} \
            -e AWS_SECRET_ACCESS_KEY=${{ steps.creds.outputs.aws-secret-access-key }} \
            -e AWS_SESSION_TOKEN=${{ steps.creds.outputs.aws-session-token }} \
            -v ${{ github.workspace }}:/github/workspace \
            -v /tmp/github_workflow:/tmp/github_workflow \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.aws:/root/.aws \
            DEMO_AWS_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/mf-code-reviewer:latest \
            python -m pr_agent.servers.github_action_runner

  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, sonar, validate, pr-agent]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Post PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const sonarStatus  = '${{ needs.sonar.outputs.quality_gate_status }}' || 'UNKNOWN';
            const buildResult  = '${{ needs.validate.result }}';
            const lintResult   = '${{ needs.validate.outputs.lint_result }}';
            const testResult   = '${{ needs.validate.outputs.test_result }}';
            const secretsResult = '${{ needs.gitleaks.result }}';
            const aiResult     = '${{ needs.pr-agent.result }}';

            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : '⚠️';
            const sonarIcon = sonarStatus === 'PASSED' ? '✅' : sonarStatus === 'FAILED' ? '❌' : '⚠️';

            const body = [
              '## PR Checks Summary',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| 🔨 Build | ${icon(buildResult)} ${buildResult === 'success' ? 'Passed' : 'Failed'} |`,
              `| 🎨 Lint | ${icon(lintResult)} ${lintResult === 'success' ? 'Passed' : 'Failed — run \`dotnet format\` locally to fix'} |`,
              `| 🧪 Tests | ${icon(testResult)} ${testResult === 'success' ? 'Passed' : 'Some tests failing'} |`,
              `| 🔐 Secrets | ${icon(secretsResult)} ${secretsResult === 'success' ? 'No secrets detected' : 'Secrets detected — check artifacts'} |`,
              `| 📊 SonarQube | ${sonarIcon} Quality Gate ${sonarStatus} |`,
              `| 🤖 AI Review | ${icon(aiResult)} ${aiResult === 'success' ? 'Review posted above' : 'Review unavailable'} |`,
            ].join('\n');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const existingBody = pr.data.body || '';
            const marker = '## PR Checks Summary';
            const updatedBody = existingBody.includes(marker)
              ? existingBody.replace(/## PR Checks Summary[\s\S]*/, body)
              : existingBody + '\n\n' + body;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: updatedBody,
            });
